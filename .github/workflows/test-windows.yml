---
name: Test Windows

on:
  pull_request:
  workflow_dispatch:
  merge_group:

env:
  TWITCH_PUBSUB_SERVER_TAG: v1.0.12
  HTTPBOX_TAG: v0.2.1
  QT_QPA_PLATFORM: minimal
  CONAN_VERSION: 2.28.1

concurrency:
  group: test-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-windows:
    name: "Test ${{ matrix.os }}, Qt ${{ matrix.qt-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        # The vendored kimageformats uses Qt 6.8 color-space APIs. The
        # Windows build ships Qt 6.9.3, so tests use that same version.
        qt-version: [6.9.3]
        skip-artifact: [false]
        skip-crashpad: [false]
      fail-fast: false
    env:
      QT_MODULES: qtimageformats
      C2_USE_OPENSSL3: ${{ case(startsWith(matrix.qt-version, '6.'), 'True', 'False') }}
      C2_CONAN_CACHE_SUFFIX: ${{ case(startsWith(matrix.qt-version, '6.'), '-QT6', '') }}

    steps:
      - name: Set Crashpad
        if: matrix.skip-crashpad == false
        run: |
          echo "C2_ENABLE_CRASHPAD=ON" >> "$Env:GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0 # allows for tags access

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          cache: true
          cache-key-prefix: ${{ runner.os }}-QtCache-${{ matrix.qt-version }}-v2
          modules: ${{ env.QT_MODULES }}
          version: ${{ matrix.qt-version }}

      - name: Enable Developer Command Prompt
        uses: Chatterino/msvc-dev-cmd@v2.0.5
        with:
          arch: x64

      - name: Setup sccache
        # A transient GitHub download failure should not fail the tests.
        continue-on-error: true
        # sccache v0.7.4
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          variant: sccache
          # only save on the default (master) branch
          save: ${{ github.event_name == 'push' }}
          key: sccache-test-${{ matrix.os }}-${{ matrix.qt-version }}-${{ matrix.skip-crashpad }}
          restore-keys: |
            sccache-test-${{ matrix.os }}-${{ matrix.qt-version }}

      - name: Cache conan packages
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-conan-user-${{ hashFiles('**/conanfile.py') }}-QT6
          path: ~/.conan2/

      - name: Install Conan
        run: |
          python3 -c "import site; import sys; print(f'{site.USER_BASE}\\Python{sys.version_info.major}{sys.version_info.minor}\\Scripts')" >> "$Env:GITHUB_PATH"
          pip3 install --user "conan==${{ env.CONAN_VERSION }}"

      - name: Setup Conan
        run: |
          conan --version
          conan profile detect -f

      - name: Install dependencies
        run: |
          $hookDir = Join-Path $env:USERPROFILE ".conan2\extensions\hooks"
          New-Item -ItemType Directory -Force -Path $hookDir | Out-Null
          Copy-Item .github/conan/hooks/hook_libwebm_msvc.py $hookDir
          mkdir build-test
          cd build-test
          conan install .. `
              -s build_type=RelWithDebInfo `
              -c tools.cmake.cmaketoolchain:generator="Ninja" `
              -b missing `
              --output-folder=. `
              -o with_openssl3="$Env:C2_USE_OPENSSL3"

      # The image CRT can be older than the compiler. Copy the OneCore redist
      # next to the test binaries, matching the upstream Windows test job.
      - name: Install CRT
        run: |
          mkdir -Force build-test/bin
          $crt = (Get-ChildItem $Env:VCToolsRedistDir/onecore/x64 -Filter '*.CRT')[0].FullName
          echo "VCToolsRedistDir=$Env:VCToolsRedistDir"
          echo "Copying CRT from $crt"
          Copy-Item "$crt/*" build-test/bin
          Get-ChildItem build-test/bin | ForEach-Object { echo $_.FullName }

      - name: Install httpbox
        run: |
          mkdir httpbox
          Invoke-WebRequest -Uri "https://github.com/Chatterino/httpbox/releases/download/${{ env.HTTPBOX_TAG }}/httpbox-x86_64-pc-windows-msvc.zip" -outfile "httpbox.zip"
          Expand-Archive httpbox.zip -DestinationPath httpbox
          rm httpbox.zip

      # MSVC 14.51 still aborts twitch-eventsub-ws-test.exe with 0xc0000409
      # during gtest discovery after the segment heap is left off and the
      # desktop CRT is beside the executable. Build the tests with clang-cl
      # and lld, without ccache. ccache wraps rc.exe's helper and clang-cl
      # then rejects rc's /fo flag.
      - name: Build
        run: |
          cmake `
              -G Ninja `
              -DCMAKE_CXX_COMPILER=clang-cl `
              -DCMAKE_C_COMPILER=clang-cl `
              -DCMAKE_RC_COMPILER=rc.exe `
              -DCMAKE_LINKER_TYPE=LLD `
              -DCMAKE_BUILD_TYPE=RelWithDebInfo `
              -DBUILD_TESTS=On `
              -DBUILD_APP=OFF `
              -DCMAKE_TOOLCHAIN_FILE="conan_toolchain.cmake" `
              -DUSE_PRECOMPILED_HEADERS=On `
              -DBUILD_WITH_CRASHPAD="$Env:C2_ENABLE_CRASHPAD" `
              -DCHATTERINO_SPELLCHECK=On `
              ..
          ninja
        working-directory: build-test

      - name: Download and extract Twitch PubSub Server Test
        run: |
          mkdir pubsub-server-test
          Invoke-WebRequest -Uri "https://github.com/Chatterino/twitch-pubsub-server-test/releases/download/${{ env.TWITCH_PUBSUB_SERVER_TAG }}/server-${{ env.TWITCH_PUBSUB_SERVER_TAG }}-windows-amd64.zip" -outfile "pubsub-server.zip"
          Expand-Archive pubsub-server.zip -DestinationPath pubsub-server-test
          rm pubsub-server.zip
          cd pubsub-server-test
          cd ..

      - name: Test
        timeout-minutes: 30
        run: |
          ..\httpbox\httpbox.exe --port 9051 &
          cd ..\pubsub-server-test
          ./server 127.0.0.1:9050 127.0.0.1:9052 &
          cd ..\build-test
          ctest --repeat until-pass:4 --output-on-failure
        working-directory: build-test

      - name: Clean Conan cache
        run: conan cache clean --source --build --download "*"
