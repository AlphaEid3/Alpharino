---
name: Build

on:
  push:
    branches:
      - chatterino7
      - "bugfix-release/**"
      - "release/*"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      buildType:
        description: "Build type"
        required: true
        type: choice
        default: "auto"
        options:
          - auto
          - nightly
          - stable
  merge_group:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # LTO is left off so the Windows runner finishes reliably. Turn it on locally
  # with -DCHATTERINO_LTO=ON for a release-hardened link.
  C2_ENABLE_LTO: "OFF"
  CHATTERINO_REQUIRE_CLEAN_GIT: On
  CHATTERINO_BUILD_TYPE: ${{ case(inputs.buildType != '', inputs.buildType, 'auto') }}
  CONAN_VERSION: 2.28.1

jobs:
  build:
    name: "Build Windows x64, Qt ${{ matrix.qt-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            qt-version: 6.9.3
            skip-artifact: false
      fail-fast: false
    env:
      C2_ARCH: x86-64

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0 # allows for tags access

      - name: Determine build type
        id: build-type
        shell: bash
        run: |
          if [ "${CHATTERINO_BUILD_TYPE}" = "auto" ]; then
            if git describe --exact-match --match 'v*'; then
              echo "Auto - found release tag format"
              echo "NIGHTLY_BUILD=Off" >> "$GITHUB_OUTPUT"
            else
              echo "Auto - did not find release tag format"
              echo "NIGHTLY_BUILD=On" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${CHATTERINO_BUILD_TYPE}" = "nightly" ]; then
            echo "Override to nightly"
            echo "NIGHTLY_BUILD=On" >> "$GITHUB_OUTPUT"
          elif [ "${CHATTERINO_BUILD_TYPE}" = "stable" ]; then
            echo "Override to stable"
            echo "NIGHTLY_BUILD=Off" >> "$GITHUB_OUTPUT"
          else
            echo "Error: no build type variable set"
            exit 1
          fi

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4.3.1
        with:
          cache: true
          cache-key-prefix: ${{ runner.os }}-QtCache-${{ matrix.qt-version }}-v3
          # qtsvg ships inside the base Qt archives. aqtinstall 3.3 rejects it
          # as a --modules package ("not found while parsing XML").
          modules: qtimageformats
          version: ${{ matrix.qt-version }}

      - name: Enable Developer Command Prompt (Windows)
        uses: Chatterino/msvc-dev-cmd@v2.0.5
        with:
          arch: x64
          # windows-latest's default MSVC 14.51 rejects libwebm's private
          # nested HasTag helpers (C2248). The VS 2026 image still ships the
          # 14.44 toolset, which compiles that code.
          toolset: "14.44"

      - name: Setup sccache (Windows)
        # sccache v0.7.4
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          variant: sccache
          save: ${{ github.event_name == 'push' }}
          key: sccache-build-${{ matrix.os }}-${{ runner.arch }}-${{ matrix.qt-version }}
          restore-keys: |
            sccache-build-${{ matrix.os }}-${{ runner.arch }}-${{ matrix.qt-version }}

      - name: Cache conan packages (Windows)
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-conan-user-${{ hashFiles('**/conanfile.py') }}-QT6
          path: ~/.conan2/

      - name: Setup Python (Windows)
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install and Setup Conan (Windows)
        shell: bash
        run: |
          pip install conan==${{env.CONAN_VERSION}}
          conan --version
          conan profile detect -f

      - name: Install dependencies (Windows)
        shell: bash
        run: |
          mkdir build
          cd build
          # Profile detection sees VS 18 and selects MSVC 14.51 (compiler.version
          # 195). Conan then re-runs vcvars with vcvars_ver=14.5, which
          # overrides the 14.44 prompt and fails to compile libwebm (C2248).
          # compiler.version=194 plus the VS 18 install path keeps the 14.44
          # toolset that is still shipped on the image.
          conan install .. \
              -s compiler.version=194 \
              -s:b compiler.version=194 \
              -s build_type=RelWithDebInfo \
              -c tools.cmake.cmaketoolchain:generator="Ninja" \
              -c tools.microsoft.msbuild:vs_version=18 \
              -c tools.microsoft:msvc_update=4.35207 \
              -b missing \
              -c tools.build:jobs=4 \
              --output-folder=. \
              -o with_openssl3=True
          conan cache clean --source --build --download "*"

      - name: Build (Windows)
        shell: pwsh
        run: |
          cd build
          cmake `
              -G Ninja `
              -DCMAKE_BUILD_TYPE=RelWithDebInfo `
              -DCMAKE_TOOLCHAIN_FILE="conan_toolchain.cmake" `
              -DUSE_PRECOMPILED_HEADERS=ON `
              -DBUILD_WITH_CRASHPAD=Off `
              -DCHATTERINO_LTO="$Env:C2_ENABLE_LTO" `
              -DFORCE_JSON_GENERATION=Off `
              -DSKIP_JSON_GENERATION=Off `
              -DCHATTERINO_NIGHTLY_BUILD="${{ steps.build-type.outputs.NIGHTLY_BUILD }}" `
              -DCHATTERINO_SPELLCHECK=On `
              -DMOLTORINO_VELOPACK=Off `
              ..
          cmake --build . --parallel 4

      - name: Prepare build dir (windows)
        working-directory: build
        shell: pwsh
        run: |
          windeployqt bin/Alpharino.exe --release --no-compiler-runtime --no-translations --no-opengl-sw --dir Alpharino/ --force-openssl
          Copy-Item bin/Alpharino.exe Alpharino/
          if (Test-Path bin/licenses) { Copy-Item -Recurse bin/licenses Alpharino/ }
          if (Test-Path bin/support) { Copy-Item -Recurse bin/support Alpharino/ }
          ..\.CI\deploy-crt.ps1 Alpharino -Architecture x64
          7z a bin/alpharino-windows-x64-symbols.pdb.7z bin/Alpharino.pdb

      - name: Package (windows)
        working-directory: build
        shell: pwsh
        run: |
          7z a alpharino-windows-x64-portable.zip Alpharino/

      - name: Upload artifact (Windows - portable zip)
        if: ${{ !matrix.skip-artifact }}
        uses: actions/upload-artifact@v7
        with:
          name: alpharino-windows-x64-portable.zip
          path: build/alpharino-windows-x64-portable.zip

      - name: Upload artifact (Windows - symbols)
        if: ${{ !matrix.skip-artifact }}
        uses: actions/upload-artifact@v7
        with:
          name: alpharino-windows-x64-symbols.pdb.7z
          path: build/bin/alpharino-windows-x64-symbols.pdb.7z

  create-release:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/chatterino7' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        name: Download artifacts
        with:
          path: release-artifacts/
          merge-multiple: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Format changes
        id: format-changes
        run: |
          delimiter=$(openssl rand -hex 32)
          {
            echo "changelog<<$delimiter"
            python3 ./.CI/format-recent-changes.py
            echo $delimiter
          } >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Create release
        uses: ncipollo/release-action@v1.21.0
        with:
          replacesArtifacts: true
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "release-artifacts/*"
          body: ${{ steps.format-changes.outputs.changelog }}
          prerelease: ${{ github.ref == 'refs/heads/chatterino7' }}
          name: ${{ github.ref == 'refs/heads/chatterino7' && 'Nightly Release' || github.ref_name }}
          tag: ${{ github.ref == 'refs/heads/chatterino7' && 'nightly-build' || github.ref_name }}
          commit: ${{ github.sha }}

      - name: Update nightly-build tag
        if: github.ref == 'refs/heads/chatterino7'
        run: |
          git tag -f nightly-build
          git push -f origin nightly-build
        shell: bash
